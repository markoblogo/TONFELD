name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Verify release identity and versions
        run: node app/scripts/check-release-version.js

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Check app
        working-directory: app
        run: npm run check

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Build release assets
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}

      - name: Verify Mac signature and helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_bundle=$(find app/dist -maxdepth 2 -name TONFELD.app -type d -print -quit)
          test -n "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
          "$app_bundle/Contents/Resources/native/ytmamp-location" --check

      - name: Collect release assets
        shell: bash
        run: |
          shopt -s nullglob
          files=(app/dist/*.dmg app/dist/*.zip app/dist/*.exe app/dist/*.AppImage app/dist/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          mkdir release-assets
          cp "${files[@]}" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package extension
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd extension
          zip -r "../TONFELD-${version}-extension.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-extension
          path: TONFELD-*-extension.zip
          if-no-files-found: error

  publish:
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Create release and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY"
