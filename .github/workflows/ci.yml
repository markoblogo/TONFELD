name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ytmamp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-stalled-preview:
    if: github.repository == 'markoblogo/YTMamp'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Stop our stalled recording test run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/markoblogo/YTMamp/actions/runs/44088003681/cancel

  app-checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        working-directory: app
        run: npm ci

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Test
        run: node ../scripts/ci-smoke-summary.js
        working-directory: app

      - name: Package app
        working-directory: app
        run: npm run pack

      - name: Inspect live local-station directory (optional service diagnostic)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        working-directory: app
        run: node scripts/check-radio-directory.js

      - name: Build Apple Silicon preview
        if: matrix.os == 'macos-latest'
        working-directory: app
        env:
          # Ad-hoc signing uses no certificate or signing secrets. The explicit
          # mac.identity='-' must also be honored for pull-request previews.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          YTMAMP_LOCATION_ARCH: 'arm64'
        run: npm run dist:mac -- --arm64

      - name: Verify Apple Silicon signatures and ZIP
        if: matrix.os == 'macos-latest'
        run: |
          codesign --verify --deep --strict --verbose=2 app/dist/mac-arm64/YTMamp.app
          codesign -d --entitlements - --xml app/dist/mac-arm64/YTMamp.app > "$RUNNER_TEMP/ytmamp-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print com.apple.security.device.audio-input' "$RUNNER_TEMP/ytmamp-entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print NSMicrophoneUsageDescription' app/dist/mac-arm64/YTMamp.app/Contents/Info.plist
          app/dist/mac-arm64/YTMamp.app/Contents/Resources/native/ytmamp-location --check
          ditto -x -k app/dist/YTMamp-0.8.0-mac.zip "$RUNNER_TEMP/ytmamp-preview-verify"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/ytmamp-preview-verify/YTMamp.app"

      - name: Test metadata in signed Apple Silicon package
        if: matrix.os == 'macos-latest'
        working-directory: app
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: ./dist/mac-arm64/YTMamp.app/Contents/MacOS/YTMamp scripts/smoke-packaged-metadata.js "$PWD/dist/mac-arm64/YTMamp.app"

      - name: Bundle matching browser companion
        if: matrix.os == 'macos-latest'
        run: zip -r app/dist/YTMamp-0.8.0-extension.zip extension

      - name: Upload Apple Silicon preview
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: YTMamp-0.8.0-macos-arm64
          path: |
            app/dist/YTMamp-0.8.0-mac.dmg
            app/dist/YTMamp-0.8.0-mac.zip
            app/dist/YTMamp-0.8.0-extension.zip
          if-no-files-found: error

      - name: Local playback desktop smoke
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-local-playback.js

      - name: Music library desktop smoke
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-library.js

      - name: Radio desktop smoke
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-radio.js

      - name: Shared recording desktop smoke
        timeout-minutes: 2
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        run: timeout 45s xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-recording.js 2>&1 | tee recording-smoke-trace.log

      - name: Upload recording trace
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: recording-trace-${{ github.sha }}
          path: app/recording-smoke-trace.log

      - name: Nantes live streams and new-place directory diagnostic
        timeout-minutes: 5
        if: always() && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        working-directory: app
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/smoke-radio-live.js

      - name: Upload smoke summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-summary-${{ matrix.os }}-${{ github.sha }}
          path: |
            app/ci-smoke-summary.md
            app/ci-smoke-output.log
            app/local-playback-smoke.png
            app/library-smoke.png
            app/library-albums-smoke.png
            app/radio-smoke.png
            app/nantes-radio-check.json
            app/rennes-directory-check.json

      - name: Generate CI smoke checklist
        run: node scripts/generate-smoke-checklist.js

      - name: Validate CI smoke checklist
        run: node scripts/validate-smoke-checklist.js

      - name: Generate PR smoke summary
        if: github.event_name == 'pull_request'
        run: node scripts/generate-pr-smoke-summary.js

      - name: Upload smoke checklist artifact
        uses: actions/upload-artifact@v7
        with:
          name: smoke-check-${{ matrix.os }}-${{ github.sha }}
          path: ci-smoke-checklist.md

      - name: Update PR description with smoke summary
        if: github.event_name == 'pull_request' && matrix.os == 'macos-latest'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-pr-description.js
